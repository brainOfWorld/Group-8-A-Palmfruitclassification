name: fruitclassification
description: "A mobile application for Palm Fruit Classification using on-device AI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+1
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  geolocator: ^14.0.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  csv: ^8.0.0
  image_picker: ^1.2.1
  photo_manager: ^3.3.0
  # Hive dependencies for local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  flutter_animate: ^4.5.2
  shared_preferences: ^2.3.0
  fl_chart: ^0.70.2
  provider: ^6.1.2
  crypto: ^3.0.6
  local_auth: ^2.3.0
  flutter_onnxruntime: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Generators to help Hive work with custom data types
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/palm_model_v3.tflite
    - assets/labels.txt
    - assets/palm_fruit_backbone.onnx